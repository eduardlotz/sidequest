<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F2F2F9" />
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("sidequest.theme");
          const choice = ["light", "dark"].includes(stored)
            ? stored
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          document.documentElement.dataset.theme = choice;
          document.documentElement.dataset.themeChoice = choice;
          document.documentElement.style.colorScheme = choice;
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", choice === "dark" ? "#111118" : "#F2F2F9");
        } catch {
          const choice = matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
          document.documentElement.dataset.theme = choice;
          document.documentElement.dataset.themeChoice = choice;
          document.documentElement.style.colorScheme = choice;
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", choice === "dark" ? "#111118" : "#F2F2F9");
        }
      })();
    </script>
    <meta
      name="description"
      content="Turn any gaming session into a sidequest."
    />
    <link
      rel="icon"
      type="image/png"
      href="/favicon-96x96.png?v=20260801"
      sizes="96x96"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=20260801" />
    <link rel="shortcut icon" href="/favicon.ico?v=20260801" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png?v=20260801"
    />
    <meta name="apple-mobile-web-app-title" content="sidequest" />
    <link rel="manifest" href="/site.webmanifest?v=20260801" />
    <title>Sidequest</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
